name: CI - currencyservice

on:
  push:
    branches: [main]
    paths:
      - "microservices-demo/src/currencyservice/**"
      - ".github/workflows/ci-currencyservice.yml"
  workflow_dispatch: {}

env:
  IMAGE_NAME: shorya8699/currencyservice
  SERVICE_DIR: microservices-demo/src/currencyservice

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Lint: Dockerfile best-practices check ---
      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ env.SERVICE_DIR }}/Dockerfile
          no-fail: true # report issues without blocking the pipeline (Google's Dockerfile, not ours to rewrite)

      # --- Build ---
      - name: Build image
        run: |
          docker build -t "$IMAGE_NAME:${{ github.sha }}" "$SERVICE_DIR"

      # --- Scan: Trivy vulnerability scan ---
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          severity: "CRITICAL"
          exit-code: "1"
          format: "table"
          trivyignores: "${{ env.SERVICE_DIR }}/.trivyignore"

      # --- Smoke test: does the built image actually boot? ---
      - name: Smoke test - container starts and stays up
        run: |
          docker run -d --name smoketest -e PORT=7000 "$IMAGE_NAME:${{ github.sha }}"
          sleep 5
          if [ "$(docker inspect -f '{{.State.Running}}' smoketest)" != "true" ]; then
            echo "Container exited unexpectedly:"
            docker logs smoketest
            exit 1
          fi
          echo "Container is running."
          docker stop smoketest

      # --- Push to Docker Hub (only after lint/build/scan/smoke test all pass) ---
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: |
          docker tag "$IMAGE_NAME:${{ github.sha }}" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"

      # --- Slack notifications ---
      - name: Notify Slack on success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"✅ CI passed for currencyservice — pushed \`${{ env.IMAGE_NAME }}:${{ github.sha }}\` to Docker Hub. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ CI failed for currencyservice on commit \`${{ github.sha }}\`. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
