apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailservice
  labels:
    app: emailservice
spec:
  replicas: {{ .Values.emailservice.replicaCount }}
  selector:
    matchLabels:
      app: emailservice
  template:
    metadata:
      labels:
        app: emailservice
    spec:
      serviceAccountName: emailservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: "{{ .Values.emailservice.image.repository }}:{{ .Values.emailservice.image.tag }}"
        ports:
        - containerPort: {{ .Values.emailservice.port }}
        env:
        - name: PORT
          value: "{{ .Values.emailservice.port }}"
        - name: DISABLE_PROFILER
          value: "1"
        readinessProbe:
          periodSeconds: 5
          timeoutSeconds: 5
          grpc:
            port: {{ .Values.emailservice.port }}
        livenessProbe:
          periodSeconds: 5
          timeoutSeconds: 5
          grpc:
            port: {{ .Values.emailservice.port }}
        resources:
          requests:
            cpu: {{ .Values.emailservice.resources.requests.cpu }}
            memory: {{ .Values.emailservice.resources.requests.memory }}
          limits:
            cpu: {{ .Values.emailservice.resources.limits.cpu }}
            memory: {{ .Values.emailservice.resources.limits.memory }}
---
apiVersion: v1
kind: Service
metadata:
  name: emailservice
  labels:
    app: emailservice
spec:
  type: ClusterIP
  selector:
    app: emailservice
  ports:
  - name: grpc
    port: 5000
    targetPort: {{ .Values.emailservice.port }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: emailservice
