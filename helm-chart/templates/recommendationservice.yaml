apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendationservice
  labels:
    app: recommendationservice
spec:
  replicas: {{ .Values.recommendationservice.replicaCount }}
  selector:
    matchLabels:
      app: recommendationservice
  template:
    metadata:
      labels:
        app: recommendationservice
    spec:
      serviceAccountName: recommendationservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: "{{ .Values.recommendationservice.image.repository }}:{{ .Values.recommendationservice.image.tag }}"
        ports:
        - containerPort: {{ .Values.recommendationservice.port }}
        readinessProbe:
          periodSeconds: 5
          grpc:
            port: {{ .Values.recommendationservice.port }}
        livenessProbe:
          periodSeconds: 5
          grpc:
            port: {{ .Values.recommendationservice.port }}
        env:
        - name: PORT
          value: "{{ .Values.recommendationservice.port }}"
        - name: PRODUCT_CATALOG_SERVICE_ADDR
          value: "productcatalogservice:{{ .Values.productcatalogservice.port }}"
        - name: DISABLE_PROFILER
          value: "1"
        resources:
          requests:
            cpu: {{ .Values.recommendationservice.resources.requests.cpu }}
            memory: {{ .Values.recommendationservice.resources.requests.memory }}
          limits:
            cpu: {{ .Values.recommendationservice.resources.limits.cpu }}
            memory: {{ .Values.recommendationservice.resources.limits.memory }}
---
apiVersion: v1
kind: Service
metadata:
  name: recommendationservice
  labels:
    app: recommendationservice
spec:
  type: ClusterIP
  selector:
    app: recommendationservice
  ports:
  - name: grpc
    port: {{ .Values.recommendationservice.port }}
    targetPort: {{ .Values.recommendationservice.port }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recommendationservice
